[project]
name = "overcooked-zsc"
version = "1.0.0"
description = "Overcooked team task: a pure-RL zero-shot coordination agent and its training pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "torch==2.14.1",  # same as the course platform (requirements.txt)
    "safetensors>=0.8.0",
    "tensorboard",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "runs", "core"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
